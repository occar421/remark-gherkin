name: Deploy demo

on:
  workflow_run:
    workflows:
      - "CI Build"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # for downloading artifacts

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prep:
    name: Preparation of Deploy Demo
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: vp-build-artifact
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: vp install
      - name: Verify artifact
        run: |
          echo "=== dist ==="
          find . -maxdepth 4 -type f | sort

          echo
          echo "=== package ==="
          cat packages/remark-gherkin/package.json
      - name: Build demo
        run: vp run --filter ast-explorer-demo ready
        env:
          VITE_DEMO_BASE_URL: "/remark-gherkin/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ast-explorer-demo/dist
  deploy:
    needs: prep
    name: Deploy Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v5
